name: Update Bsale Data

on:
  schedule:
    - cron: "0 8 * * *"   # 8:00 UTC = 5:00 AM Chile (hora Santiago)
  workflow_dispatch:        # permite correrlo manualmente desde GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Bsale data
        env:
          BSALE_TOKEN: ${{ secrets.BSALE_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ventas.json
          git diff --cached --quiet || git commit -m "chore: update ventas data $(date -u +%Y-%m-%d)"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
